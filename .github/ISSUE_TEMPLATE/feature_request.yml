name: Feature request
description: Suggest something ghas-free-pack should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Runs open-source scanners over Shell, Dockerfile, HCL and PHP inside your own workflow. Results stay in your repo's Security tab.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
