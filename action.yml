name: 'ghas-free-pack'
# Marketplace rejects a description of 125 characters or more.
description: 'Free scanning for Shell, Dockerfiles, Terraform and PHP: ShellCheck, Hadolint, tfsec, PHPStan into one SARIF.'
author: 'Booyaka101'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  enable-shellcheck:
    description: 'Scan .sh / .bash files with ShellCheck'
    required: false
    default: 'true'
  enable-hadolint:
    description: 'Scan Dockerfile* files with Hadolint'
    required: false
    default: 'true'
  enable-tfsec:
    description: 'Scan Terraform (.tf) files with tfsec'
    required: false
    default: 'true'
  enable-phpstan:
    description: 'Scan .php files with PHPStan (off by default: many PHP projects need a tuned phpstan.neon)'
    required: false
    default: 'false'
  fail-on-warning:
    description: 'Fail the check when warnings are found (errors always fail the check)'
    required: false
    default: 'false'
  phpstan-level:
    description: 'PHPStan rule level 0-9 (used only when no phpstan.neon exists in the repo)'
    required: false
    default: '5'
  github-token:
    description: 'Token used to post the PR comment and upload SARIF (use the automatic github.token)'
    required: true
    default: ${{ github.token }}

runs:
  using: 'docker'
  # Prebuilt on GHCR rather than 'Dockerfile'. Building here meant every
  # consuming workflow rebuilt the image from ubuntu:22.04 in the runner's
  # pre-step — slow, and it put each consumer behind Docker Hub's anonymous
  # pull limits (a Guards run died on "DeadlineExceeded: ubuntu:22.04" after
  # three retries). The pre-step runs before any step, so continue-on-error
  # cannot shield a job from it. Published by .github/workflows/publish-image.yml
  # on every tag push; :v1 tracks the latest v1.x.
  image: 'docker://ghcr.io/booyaka101/ghas-free-pack:v1'
